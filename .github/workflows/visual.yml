name: Smart Ink UI regression
on: [push, pull_request, workflow_dispatch]
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:browser
        env:
          SMART_INK_UI_DIR: artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-ink-ui
          path: artifacts/ui
