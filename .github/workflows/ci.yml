name: Validate Smart Ink
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install reproducible toolchain
        run: npm ci
      - name: Build, check, test and package
        run: npm run verify
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smart-ink-plugin
          path: releases/smart-ink-*.zip
          if-no-files-found: error
